services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    ports:
      - "8000:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: audit_intelligence/backend/Dockerfile
    environment:
      APP_ENV: local
      AUTH_MODE: local
      DATASET_STORE: local
      JOB_RUNNER: inline
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      AWS_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    ports:
      - "8001:8000"
    volumes:
      - backend_uploads:/app/audit_intelligence/backend/data/uploads
    depends_on:
      dynamodb:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: audit_intelligence/frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  dynamodb_data:
  backend_uploads:
