name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Lambda targets python3.14 and node22 builds the web bundle. CI runs the
  # same versions so test behaviour and runtime behaviour cannot diverge.
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend — lint, test, lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # `.python-version` pins the interpreter; uv installs it if the runner lacks it.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest audit_intelligence/backend/tests -q

      # requirements.txt is generated from uv.lock for the Docker image and the
      # Lambda bundle. A hand edit to either file would otherwise go unnoticed
      # until a deploy ran with different versions than the tests did.
      - name: requirements.txt matches uv.lock
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project --no-header --quiet -o /tmp/requirements.txt
          diff -u requirements.txt /tmp/requirements.txt

  frontend:
    name: Frontend — lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: audit_intelligence/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: audit_intelligence/frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: End to end — real backend, real browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The same stack a developer runs locally: DynamoDB Local, the backend in
    # local auth mode, the app served by Vite, driven by Playwright.
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: audit_intelligence/frontend/package-lock.json

      - name: Install
        run: |
          uv sync --frozen
          npm ci --prefix audit_intelligence/frontend
          npx --prefix audit_intelligence/frontend playwright install --with-deps chromium

      - name: Start the backend
        working-directory: audit_intelligence/backend
        env:
          APP_ENV: local
          AUTH_MODE: local
          DATASET_STORE: local
          JOB_RUNNER: inline
          DYNAMODB_ENDPOINT: http://localhost:8000
          AWS_REGION: eu-west-1
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local
        run: |
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8011 > /tmp/backend.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:8011/health && exit 0
            sleep 1
          done
          echo "backend never became healthy" >&2
          cat /tmp/backend.log >&2
          exit 1

      - name: Smoke test
        working-directory: audit_intelligence/frontend
        env:
          CI: 'true'
          E2E_API_URL: http://127.0.0.1:8011
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: audit_intelligence/frontend/playwright-report
          retention-days: 7

  infra:
    name: Infra — typecheck, test, synth (no AWS credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # No AWS credentials are configured in this job on purpose: synth of the
      # dev stage needs none, and that is also what keeps this job from reaching
      # real AWS even by accident. `cdk synth` exits non-zero on an app with no
      # stacks, so this waits for the first stack (phase 2) rather than
      # swallowing real failures with `|| true`.
      - if: hashFiles('infra/lib/stacks/**/*.ts') != ''
        run: npm run synth
