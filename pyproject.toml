[project]
name = "audit-intelligence"
version = "0.1.0"
description = "Audit Intelligence — fraud-detection platform for Kenyan SACCOs"
requires-python = ">=3.14,<3.15"
dependencies = [
  "anthropic>=0.120,<1",
  "aws-lambda-powertools>=3.36.0",
  "bcrypt>=5.0,<6",
  "boto3>=1.43.114",
  "fastapi>=0.140,<1",
  "mangum>=0.22.0",
  "networkx>=3.6,<4",
  "numpy>=2.5,<3",
  "pandas>=3.0,<4",
  "pyjwt[crypto]>=2.13,<3",
  "python-multipart>=0.0.32,<1",
  "uvicorn>=0.51,<1",
]

[dependency-groups]
dev = [
  # generate_data.py only; the engine itself never imports it.
  "faker>=40,<41",
  "httpx>=0.28,<1",
  "moto[cognitoidp,dynamodb,s3,sqs]>=5.2.4",
  "pytest>=9.1,<10",
  "ruff>=0.9",
]

[tool.uv]
# An application, not a library: nothing here is built or installed as a wheel.
package = false

[tool.pytest.ini_options]
testpaths = ["audit_intelligence/backend/tests"]
pythonpath = ["audit_intelligence/backend"]

[tool.ruff]
line-length = 120
extend-exclude = [".venv*", "synthetic_sacco_data"]

[tool.ruff.lint]
select = ["E", "F"]
# The codebase predates a formatter; long lines are not worth a 250-line diff.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test modules set up the app/env before importing it.
"audit_intelligence/backend/tests/*" = ["E402"]
