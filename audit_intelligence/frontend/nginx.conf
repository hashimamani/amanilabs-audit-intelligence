server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # "backend" is the docker-compose service name, resolved on the
    # internal compose network - stable regardless of external host/domain.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # nginx's default proxy_read_timeout (60s) was firing as a 504
        # "Gateway Timeout" on the AI endpoints (/analytics/query,
        # /reports/generate) - both routinely take 30-90s (code-execution
        # round trip, or Opus over up to 20 batched cases, sometimes with a
        # pause_turn retry that roughly doubles the wait - see
        # PROJECT_CONTEXT.md section 21). nginx was killing the connection
        # while the backend was still working. 180s covers the documented
        # worst case with real margin; harmless for every other route,
        # which returns in milliseconds either way.
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # SPA fallback: client-side routes (e.g. /cases/5) have no matching
    # file on disk, so a direct link or hard refresh needs to still serve
    # index.html and let React Router take over.
    location / {
        try_files $uri /index.html;
    }
}
